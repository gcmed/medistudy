<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>MediStudy</title><style>
:root{--bg:#07111f;--card:#101c2e;--txt:#f6f8fb;--muted:#aab7c8;--accent:#4fd1a5;--line:#26374f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07111f,#0c1727);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,Arial;min-height:100vh}.app{max-width:760px;margin:auto;padding:22px 18px 100px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:25px;font-weight:850}.brand b{color:var(--accent)}.pill{font-size:12px;background:#163028;color:#8df0cb;padding:7px 10px;border-radius:99px}.hero{padding:28px 0 15px}.hero h1{font-size:34px;line-height:1.05;margin:0 0 10px}.muted,.hero p{color:var(--muted)}.title{font-weight:800;margin:23px 0 11px}.card,.area{background:linear-gradient(145deg,#15243a,var(--card));border:1px solid var(--line);border-radius:20px;padding:16px}.areas{display:grid;gap:10px}.area{display:flex;gap:12px;cursor:pointer}.area.active,.mode.active{border-color:var(--accent)}.area i{font-style:normal;font-size:25px}.area small{display:block;color:var(--muted);margin-top:4px}.search{display:flex;background:white;padding:6px;border-radius:18px;margin-top:17px}.search input{flex:1;border:0;outline:0;padding:12px;font-size:16px;min-width:0}.search button,.primary{border:0;background:var(--accent);color:#062016;font-weight:800;border-radius:14px;padding:0 16px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{cursor:pointer}.mode h3{margin:7px 0}.mode p{font-size:13px;color:var(--muted);margin:0}.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#091422;padding:4px;border-radius:13px}.seg button{border:0;background:none;color:var(--muted);padding:10px;border-radius:10px;font-weight:700}.seg .active{background:#26374f;color:white}.btn{border:1px solid var(--line);background:#132237;color:white;border-radius:12px;padding:10px;font-weight:700}.hidden{display:none!important}.lesson article{white-space:pre-wrap;line-height:1.65}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end}.sheet{width:100%;max-width:760px;margin:auto;background:#0d1929;padding:20px;border-radius:24px 24px 0 0}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#07111f;color:white;font-size:16px}.nav{position:fixed;bottom:0;left:0;right:0;background:#091422ee;padding:11px 16px 20px;display:flex;justify-content:space-around}.nav button{background:none;border:0;color:#aab7c8}.nav span{display:block;font-size:20px}.error{background:#411d25;padding:12px;border-radius:12px;color:#ffd0d0}@media(min-width:700px){.areas{grid-template-columns:repeat(3,1fr)}.modes{grid-template-columns:repeat(4,1fr)}}</style></head><body>
<div class="app"><div class="top"><div class="brand">Medi<b>Study</b></div><div class="row"><span class="pill">V0.2 Web</span><button class="btn" onclick="settings()">⚙︎</button></div></div>
<section id="home"><div class="hero"><h1>O que você quer<br>dominar hoje?</h1><p>Medicina, medicina legal ou qualquer outro assunto.</p></div><div class="title">Área de estudo</div><div class="areas" id="areas"></div><div class="search"><input id="q" placeholder="Digite qualquer tema"><button onclick="study()">Estudar</button></div><div class="title">Modo de estudo</div><div class="modes" id="modes"></div><div class="title">Motor</div><div class="card"><div class="seg" id="engines"></div><p class="muted" id="help"></p></div></section>
<section id="lesson" class="hidden lesson"><div class="hero"><small id="meta" style="color:var(--accent)"></small><h1 id="lt"></h1><p id="sub"></p></div><div id="err" class="error hidden"></div><div class="card"><article id="body"></article><div class="row" style="margin-top:16px;justify-content:flex-start"><button class="btn" onclick="fav()">★ Favoritar</button><button class="btn" onclick="home()">← Início</button></div></div></section>
<section id="library" class="hidden"><div class="hero"><h1>Biblioteca</h1><p>Histórico salvo neste aparelho.</p></div><div class="card" id="hist"></div></section></div>
<div id="modal" class="modal hidden"><div class="sheet"><div class="row"><b style="font-size:21px">Configurações</b><button class="btn" onclick="modal.classList.add('hidden')">Fechar</button></div><div class="field"><label>URL do backend seguro</label><input id="api" placeholder="https://..."></div><div class="field"><label>Modelo</label><select id="model"><option>gpt-5</option><option>gpt-5-mini</option></select></div><div class="field"><label>Profundidade</label><select id="depth"><option>Rápido</option><option>Completo</option><option selected>Aprofundado</option><option>Livro/Aula</option></select></div><button class="primary" style="width:100%;padding:14px" onclick="saveSettings()">Salvar</button><p class="muted" style="font-size:12px">A chave da OpenAI fica somente no backend, nunca neste HTML.</p></div></div>
<nav class="nav"><button onclick="home()"><span>⌂</span>Início</button><button onclick="library()"><span>▤</span>Biblioteca</button><button onclick="favorites()"><span>★</span>Favoritos</button><button onclick="settings()"><span>⚙︎</span>Ajustes</button></nav>
<script>
let S={area:'Medicina Geral',mode:'Aprofundado',engine:'Híbrido',current:null};let A=[['Medicina Geral','🩺','Clínica, mecanismos, diagnóstico e tratamento.'],['Medicina Legal','⚖️','Perícias, traumatologia, tanatologia e concursos.'],['Estudos Gerais','🧠','Qualquer assunto fora da saúde.']];let M=[['Fácil','💡','Do zero, extremamente simples.'],['Aprofundado','🔬','Nível livro/aula, mecanismos e detalhes.'],['Professor','🎓','Aprenda para conseguir ensinar.'],['Prova','⚡️','Questões, casos e revisão ativa.']];let E=['IA','Pesquisa','Híbrido'];
function render(){areas.innerHTML=A.map(a=>`<div class="area ${S.area==a[0]?'active':''}" onclick="S.area='${a[0]}';render()"><i>${a[1]}</i><div><b>${a[0]}</b><small>${a[2]}</small></div></div>`).join('');modes.innerHTML=M.map(m=>`<div class="card mode ${S.mode==m[0]?'active':''}" onclick="S.mode='${m[0]}';render()"><div>${m[1]}</div><h3>${m[0]}</h3><p>${m[2]}</p></div>`).join('');engines.innerHTML=E.map(e=>`<button class="${S.engine==e?'active':''}" onclick="S.engine='${e}';render()">${e}</button>`).join('');help.textContent=S.engine=='IA'?'IA gera e organiza o conteúdo.':S.engine=='Pesquisa'?'Pesquisa prioriza fontes externas.':'Pesquisa + IA para explicar e organizar.'}
function cfg(){return JSON.parse(localStorage.getItem('ms_cfg')||'{"api":"","model":"gpt-5","depth":"Aprofundado"}')}function settings(){let c=cfg();api.value=c.api;model.value=c.model;depth.value=c.depth;modal.classList.remove('hidden')}function saveSettings(){localStorage.setItem('ms_cfg',JSON.stringify({api:api.value.trim().replace(/\/$/,''),model:model.value,depth:depth.value}));modal.classList.add('hidden')}
function show(x){['home','lesson','library'].forEach(i=>document.getElementById(i).classList.toggle('hidden',i!=x))}function home(){show('home');render()}function H(){return JSON.parse(localStorage.getItem('ms_hist')||'[]')}function save(x){let h=H().filter(y=>!(y.topic==x.topic&&y.mode==x.mode));h.unshift(x);localStorage.setItem('ms_hist',JSON.stringify(h.slice(0,100)))}
async function study(){let t=q.value.trim()||'Síndrome do túnel do carpo',c=cfg();S.current={topic:t,area:S.area,mode:S.mode,engine:S.engine,favorite:false};show('lesson');lt.textContent=t;meta.textContent=(S.area+' • '+S.mode).toUpperCase();sub.textContent=S.engine+' • '+c.depth;err.classList.add('hidden');body.textContent='Construindo seu estudo…';if(!c.api){body.textContent='MODO DEMONSTRAÇÃO\n\nA interface está funcionando. Configure o endereço do backend seguro em ⚙︎ Ajustes para gerar conteúdo real com IA.';S.current.content=body.textContent;save(S.current);return}try{let r=await fetch(c.api+'/api/study',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:t,area:S.area,mode:S.mode,engine:S.engine,model:c.model,depth:c.depth})});let d=await r.json();if(!r.ok)throw Error(d.error||'Falha');body.textContent=d.text;S.current.content=d.text;save(S.current)}catch(e){err.textContent='Erro: '+e.message;err.classList.remove('hidden');body.textContent=''}}
function fav(){if(S.current){S.current.favorite=true;save(S.current);alert('Favoritado')}}function library(f=false){show('library');let h=H().filter(x=>!f||x.favorite);hist.innerHTML=h.length?h.map((x,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)" onclick="openItem(${i},${f})"><b>${x.topic}</b><div class="muted">${x.area} • ${x.mode}${x.favorite?' • ★':''}</div></div>`).join(''):'<p class="muted">Nada salvo ainda.</p>';window.list=h}function favorites(){library(true)}function openItem(i){let x=window.list[i];S.current=x;show('lesson');lt.textContent=x.topic;meta.textContent=(x.area+' • '+x.mode).toUpperCase();sub.textContent='Conteúdo salvo';body.textContent=x.content||'';err.classList.add('hidden')}render();
</script></body></html>
